    <style>
        :root {
            --accent: #00ffcc;
            --accent-dim: rgba(0, 255, 204, 0.25);
            --accent-glow: rgba(0, 255, 204, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body, html {
            height: 100%;
            font-family: 'Comfortaa', sans-serif;
            background-color: #000;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #000;
        }

        /* WEBGL PROCEDURAL NOISE SHADER CANVAS */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            /* Blurs the chunky pixels just enough to look like a compressed 480p video instead of harsh blocks */
            filter: blur(1px); 
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55); 
            z-index: 1;
            pointer-events: none;
        }

        /* HORIZONTALLY SCROLLING UNIX TIMESTAMP CANVAS */
        #unix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        .content-body {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 0 60px 0;
            gap: 40px;
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
            margin-top: 10px;
            position: relative;
            width: 100%;
        }

        .username, .section-title, .nav-arrow {
            font-family: 'Comfortaa', sans-serif;
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
            background: none;
            transition: -webkit-text-stroke-color 0.1s linear;
        }

        .username {
            font-size: 3.8rem;
            font-weight: 300;
            -webkit-text-stroke: 0.8px var(--accent);
            letter-spacing: 2px;
            filter: drop-shadow(0 0 6px var(--accent-dim));
            position: relative;
            z-index: 4;
            background: transparent !important;
        }

        .section-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .section-title {
            font-size: 2.1rem;
            font-weight: 300;
            -webkit-text-stroke: 0.75px var(--accent);
            letter-spacing: 1px;
            filter: drop-shadow(0 0 5px var(--accent-dim));
            text-align: center;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            position: relative;
        }

        .nav-arrow {
            font-size: 4rem;
            -webkit-text-stroke: 1px var(--accent);
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease;
            padding: 0 15px;
            z-index: 10;
            line-height: 1;
            filter: drop-shadow(0 0 8px var(--accent-dim));
        }
        
        .nav-arrow:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 16px var(--accent-glow));
        }

        .cards-scroll-viewport {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            width: 100%;
            max-width: 1200px;
            padding: 15px 0;
            position: relative;

            -webkit-mask-image: linear-gradient(
                to right,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 1) 8%,
                rgba(0, 0, 0, 1) 92%,
                rgba(0, 0, 0, 0) 100%
            );
            mask-image: linear-gradient(
                to right,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 1) 8%,
                rgba(0, 0, 0, 1) 92%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        .cards-scroll-viewport::-webkit-scrollbar {
            display: none;
        }

        .cards-wrapper {
            display: flex;
            position: relative;
            align-items: flex-start;
            min-width: max-content;
            padding: 0 10px;
        }

        .cards-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1.5px;
            border-top: 1.5px dashed var(--accent);
            z-index: 1;
            pointer-events: none;
        }

        .card {
            width: 180px;
            height: 220px;
            background-color: rgba(0, 0, 0, 0.85) !important;
            margin: 0 12px;
            border: 1.5px solid var(--accent);
            border-top: none;
            
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
            
            position: relative;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            
            font-family: 'Comfortaa', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
            -webkit-text-stroke: 0.65px var(--accent);
            
            filter: drop-shadow(0 0 4px var(--accent-dim));
            
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background-color 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease, border-radius 0.4s ease;
        }

        .card::before, .card::after {
            content: '';
            position: absolute;
            top: 0;
            width: 12px;
            height: 1.5px;
            background: var(--accent);
            transition: background 0.1s linear;
        }
        .card::before { left: -1.5px; }
        .card::after { right: -1.5px; }

        .card:hover {
            background-color: var(--accent-dim) !important;
            border-color: #ffffff;
            box-shadow: 0 15px 35px var(--accent-dim);
            transform: translateY(10px) scale(1.02);
            border-bottom-left-radius: 42px;
            border-bottom-right-radius: 42px;
        }

        .card:hover::before, .card:hover::after {
            background: #ffffff;
        }
    </style>

    <script>
        function hslToRgb(h, s, l) {
            h /= 360;
            const a = s * Math.min(l, 1 - l);
            const f = (n) => {
                const k = (n + h * 12) % 12;
                return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
            };
            return [f(0), f(8), f(4)];
        }
    </script>

    <!-- CONTINUOUS EPOCH TRANSFORM TICKER ENGINE -->
    <script>
        const unixCanvas = document.getElementById('unix-canvas');
        const ctxUnix = unixCanvas.getContext('2d');

        let uWidth = window.innerWidth;
        let uHeight = window.innerHeight;

        function resizeUnixCanvas() {
            uWidth = window.innerWidth;
            uHeight = window.innerHeight;
            unixCanvas.width = uWidth;
            unixCanvas.height = uHeight;
        }
        window.addEventListener('resize', resizeUnixCanvas);
        resizeUnixCanvas();

        function renderUnixTicker() {
            ctxUnix.clearRect(0, 0, uWidth, uHeight);

            const usernameEl = document.querySelector('.username');
            if (!usernameEl) {
                requestAnimationFrame(renderUnixTicker);
                return;
            }

            const rect = usernameEl.getBoundingClientRect();
            const centerY = rect.top + (rect.height / 2);
            
            const clampedY = Math.max(0, Math.min(centerY, uHeight));
            
            const computedStyle = window.getComputedStyle(usernameEl);
            const fontSize = parseFloat(computedStyle.fontSize) || 60;

            ctxUnix.font = `300 ${fontSize}px "Comfortaa", sans-serif`;

            const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#00ffcc';
            
            ctxUnix.strokeStyle = accentColor;
            ctxUnix.lineWidth = 1.0; 
            ctxUnix.globalAlpha = 0.4;
            ctxUnix.shadowColor = accentColor;
            ctxUnix.shadowBlur = 4;
            ctxUnix.textBaseline = 'middle';
            ctxUnix.textAlign = 'center';

            const continuousTimeSec = Date.now() / 1000;
            const spacingPx = 280;
            const halfViewportWidth = uWidth / 2;

            const minTimestamp = Math.floor(continuousTimeSec - (halfViewportWidth / spacingPx) - 1);
            const maxTimestamp = Math.ceil(continuousTimeSec + (halfViewportWidth / spacingPx) + 1);

            for (let epochSec = minTimestamp; epochSec <= maxTimestamp; epochSec++) {
                const xPos = (epochSec - continuousTimeSec) * spacingPx + halfViewportWidth;
                ctxUnix.strokeText(epochSec.toString(), xPos, clampedY);
            }

            requestAnimationFrame(renderUnixTicker);
        }

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                renderUnixTicker();
            });
        } else {
            setTimeout(renderUnixTicker, 500);
        }
    </script>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const vsCode = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;

        const snoiseCode = `
          vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
          vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
          vec4 permute(vec4 x) { return mod289(((x*34.0)+10.0)*x); }
          vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

          float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.5 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
            m = m * m;
            return 105.0 * dot(m*m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
          }
        `;

        const fsCode = `
          uniform float time;
          uniform vec2 resolution;
          uniform vec3 colorA;
          uniform vec3 colorB;
          varying vec2 vUv;

          void main() {
            // Snap UV coordinates to a chunky grid to force low-res 480p topology
            vec2 resolutionScale = resolution / 4.0; 
            vec2 gridUv = floor(vUv * resolutionScale) / resolutionScale;
            
            vec2 st = gridUv - vec2(0.5);
            st.x *= (resolution.x / resolution.y);

            // Gentle rotation
            float angle = time * 0.025; 
            float c = cos(angle);
            float s = sin(angle);
            mat2 rot = mat2(c, -s, s, c);
            vec2 rotSt = rot * st;

            // LOW TOPOGRAPHY: Large, broad noise features
            vec2 drift = vec2(time * 0.015, time * 0.010);
            float noiseValue = snoise(vec3(rotSt * 1.5 + drift, time * 0.05));

            // TOPOGRAPHIC CONTOUR LINES:
            float contour = fract(noiseValue * 5.0);
            float contourDerivative = fwidth(contour);
            
            float lineWidth = 0.05;
            float topographyLine = smoothstep(0.0, lineWidth, contour) - smoothstep(lineWidth, lineWidth + contourDerivative, contour);
            
            // Inverted topography lines
            topographyLine = topographyLine;

            // Add smooth color variation across the low topography
            float smoothNoise = noiseValue * 0.5 + 0.5;
            vec3 lineRGB = mix(colorA, colorB, smoothNoise);

            // Apply a gentle glow to the bright areas (negative space)
            float edgeAlpha = topographyLine * 0.6; 
            lineRGB += vec3(0.1) * topographyLine;

            gl_FragColor = vec4(lineRGB, edgeAlpha);
          }
        `;

        let width = window.innerWidth;
        let height = window.innerHeight;

        const webglCanvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(0, width, 0, height, 1, 3);
        camera.position.z = 2;

        const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: false, alpha: true });
        // CRITICAL 480P EFFECT: Set drawing buffer to 1/4th the normal resolution
        renderer.setPixelRatio(0.25); 
        renderer.setSize(width, height);

        let geometry = new THREE.PlaneGeometry(width, height);
        geometry.translate(width / 2, height / 2, 0); 

        function hslToRgbVec(h, s, l) {
            h /= 360;
            const a = s * Math.min(l, 1 - l);
            const f = (n) => {
                const k = (n + h * 12) % 12;
                return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
            };
            return new THREE.Vector3(f(0), f(8), f(4));
        }

        const uniforms = {
          time: { value: 0.0 },
          resolution: { value: new THREE.Vector2(width, height) },
          colorA: { value: new THREE.Vector3() },
          colorB: { value: new THREE.Vector3() }
        };

        const material = new THREE.ShaderMaterial({
          uniforms: uniforms,
          vertexShader: vsCode,
          fragmentShader: snoiseCode + fsCode,
          transparent: true,
          side: THREE.DoubleSide
        });

        let mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const clockEngine = new THREE.Clock();

        function animateColors(elapsedTime) {
            const currentHue = 210 + Math.sin(elapsedTime * 0.4) * 40;
            const secondaryHue = (currentHue + 30) % 360;

            const rgb = hslToRgb(currentHue, 1.0, 0.55);
            const r = Math.round(rgb[0] * 255);
            const g = Math.round(rgb[1] * 255);
            const b = Math.round(rgb[2] * 255);

            document.documentElement.style.setProperty('--accent', `rgba(${r}, ${g}, ${b}, 1)`);
            document.documentElement.style.setProperty('--accent-dim', `rgba(${r}, ${g}, ${b}, 0.25)`);
            document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.9)`);

            uniforms.colorA.value.copy(hslToRgbVec(currentHue, 0.9, 0.35));
            uniforms.colorB.value.copy(hslToRgbVec(secondaryHue, 0.95, 0.62));
        }

        function animate() {
          requestAnimationFrame(animate);
          const elapsedTime = clockEngine.getElapsedTime();
          uniforms.time.value = elapsedTime;
          
          animateColors(elapsedTime);
          
          renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            
            renderer.setSize(width, height);
            uniforms.resolution.value.set(width, height);
            
            camera.right = width;
            camera.bottom = height;
            camera.updateProjectionMatrix();
            
            scene.remove(mesh);
            geometry.dispose();
            geometry = new THREE.PlaneGeometry(width, height);
            geometry.translate(width / 2, height / 2, 0);
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
        });
    </script>
